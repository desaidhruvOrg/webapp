name: Build AMI

on:
    push:
        branches: [main, a04a]
        paths:
            - "packer/**"
            - "**.js"
            - "package.json"
            - "package-lock.json"
            - "setup.sh"

jobs:
    build:
        runs-on: ubuntu-latest

        # services:
        #   mysql:
