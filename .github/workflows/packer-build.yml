        steps:
            - uses: actions/checkout@v4
            - name: Upload Zip File
              uses: actions/upload-artifact@v4
              with:
                  name: webapp zip creation
                  path: webapp.zip

            # Verify required secrets
            - name: Verify Required Secrets
              run: |
                  missing_secrets=()

                  # Check each required secret
                  if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
                    missing_secrets+=("AWS_ACCESS_KEY_ID")
                  fi
                  if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
                    missing_secrets+=("AWS_SECRET_ACCESS_KEY")
                  fi
                  if [ -z "${{ secrets.AWS_REGION }}" ]; then
                    missing_secrets+=("AWS_REGION")
                  fi
                  if [ -z "${{ secrets.DB_NAME }}" ]; then
                    missing_secrets+=("DB_NAME")
                  fi
                  if [ -z "${{ secrets.DB_USER }}" ]; then
                    missing_secrets+=("DB_USER")
                  fi
                  if [ -z "${{ secrets.DB_PASS }}" ]; then
                    missing_secrets+=("DB_PASS")
                  fi
                  if [ -z "${{ secrets.VPC_ID }}" ]; then
                    missing_secrets+=("VPC_ID")
                  fi
                  if [ -z "${{ secrets.SUBNET_ID }}" ]; then
                    missing_secrets+=("SUBNET_ID")
                  fi

                  # Check if any secrets are missing
                  if [ ${#missing_secrets[@]} -ne 0 ]; then
                    echo "Error: The following secrets are not set:"
                    printf '%s\n' "${missing_secrets[@]}"
                    exit 1
                  fi

              # if [ -z "${{ secrets.GCP_PROJECT_ID }}" ]; then
              #   missing_secrets+=("GCP_PROJECT_ID")
              # fi
              # if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
              #   missing_secrets+=("GCP_SA_KEY")
              # fi
              # if [ -z "${{ secrets.GCP_CREDENTIALS_B64 }}" ]; then
              #   missing_secrets+=("GCP_CREDENTIALS_B64")
              # fi

            # Create .env file
            # - name: Create .env file
            #   run: |
            #     touch .env
            #     echo "DB_PORT=${{secrets.DB_PORT}}" >> .env
            #     echo "DB_NAME=${{secrets.DB_NAME}}" >> .env
            #     echo "DB_PASS=${{secrets.DB_PASS}}" >> .env
            #     echo "DB_USER=${{secrets.DB_USER}}" >> .env
            #     echo "DB_HOST=${{secrets.DB_HOST}}" >> .env
            #     cat .env
            # - name: Set up Node.js
            #   uses: actions/setup-node@v3
            #   with:
            #     node-version: '20'
            #     cache: 'npm'
            # - name: Install dependencies
            #   run: npm ci
            # - name: Configure Environment Variables
            #   run: |
            #     echo DB_USER=${{ secrets.DB_USER }}
            #     echo DB_PASS=${{ secrets.DB_PASS }}
            #     echo DB_NAME=${{ secrets.DB_NAME }}
            #     echo DB_HOST=${{ secrets.DB_HOST }}
            #     echo DB_PORT=${{ secrets.DB_PORT }}
            # - name: Wait for MySQL
            #   run: |
            #     until mysqladmin ping -h "127.0.0.1" --silent; do
            #       echo "Waiting for MySQL to be ready..."
            #       sleep 5
            #     done
            # - name: Run tests
            #   run: npm test
            #   env:
            #     DB_PORT: 3306
            #     DB_NAME: ${{secrets.DB_NAME}}
            #     DB_PASS: ${{secrets.DB_PASS}}
            #     DB_USER: ${{secrets.DB_USER}}
            #     DB_HOST: "127.0.0.1"
            # First, create the webapp.zip
            - name: Create build artifact
              run: |
                  zip -r webapp.zip . -x "packer/*" -x ".git/*" -x ".github/*" -x "node_modules/*" -x "coverage/*"

              # Then check if it exists
            - name: Check if webapp.zip Exists
              run: |
                  if [ -f ./webapp.zip ]; then
                    echo "webapp.zip exists."
                    ls -l webapp.zip
                  else
                    echo "webapp.zip does not exist."
                    pwd
                    ls -la
                    exit 1
                  fi

            # - name: Setup GCP Credentials
            #   run: |
            #     echo "${{ secrets.GCP_CREDENTIALS_B64 }}" | base64 -d > gcp-credentials.json

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ secrets.AWS_REGION }}

            - name: Verify AWS Credentials
              run: aws sts get-caller-identity

            # - name: Setup Google Cloud SDK
            #   uses: google-github-actions/setup-gcloud@v1
            #   with:
            #     project_id: ${{ secrets.GCP_PROJECT_ID }}
            #     service_account_key: ${{ secrets.GCP_SA_KEY }}
            #     export_default_credentials: true

            # - name: Authenticate with Google Cloud
            #   uses: google-github-actions/auth@v2
            #   with:
            #     credentials_json: ${{ secrets.GCP_SA_KEY }}
            #     create_credentials_file: true
            #     export_environment_variables: true
            #     cleanup_credentials: true

            # IMPORTANT: Make sure billing is enabled for your GCP project!
            # - name: Enable Compute Engine API
            #   run: |
            #     gcloud services enable compute.googleapis.com --quiet --project=${{ secrets.GCP_PROJECT_ID }}

            # - name: Create Firewall Rule for Inbound Traffic
            #   run: |
            #     if ! gcloud compute firewall-rules describe allow-all-access --quiet 2>/dev/null; then
            #       gcloud compute firewall-rules create allow-all-access \
            #         --network=default \
            #         --allow tcp:22,tcp:80,tcp:443,tcp:8080 \
            #         --target-tags=allow-all-access \
            #         --source-ranges=0.0.0.0/0 \
            #         --quiet
            #     else
            #       echo "Firewall rule 'allow-all-access' already exists"
            #       # Optionally update the existing rule if needed
            #       gcloud compute firewall-rules update allow-all-access \
            #         --allow tcp:22,tcp:80,tcp:443,tcp:8080 \
            #         --target-tags=allow-all-access \
            #         --source-ranges=0.0.0.0/0 \
            #         --quiet
            #     fi

            - name: Setup Packer
              uses: hashicorp/setup-packer@main
              with:
                  version: "1.9.4"

            - name: Initialize Packer
              working-directory: ./packer
              run: packer init aws-ubuntu.pkr.hcl

            - name: Validate Packer Template
              working-directory: ./packer
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  # PKR_VAR_db_pass: ${{ secrets.DB_PASS }}
                  # PKR_VAR_db_name: ${{ secrets.DB_NAME }}
                  # PKR_VAR_db_user: ${{ secrets.DB_USER }}
                  PKR_VAR_vpc_id: ${{ secrets.VPC_ID }}
                  PKR_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
                  PKR_VAR_aws_region: ${{ secrets.AWS_REGION }}
                  PKR_VAR_demo_user: ${{ secrets.DEMO_USER }}
                  # PKR_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
                  # GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
              run: packer validate aws-ubuntu.pkr.hcl

            - name: Build AMI
              working-directory: ./packer
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}
                  # PKR_VAR_db_pass: ${{ secrets.DB_PASS }}
                  # PKR_VAR_db_name: ${{ secrets.DB_NAME }}
                  # PKR_VAR_db_user: ${{ secrets.DB_USER }}
                  PKR_VAR_vpc_id: ${{ secrets.VPC_ID }}
                  PKR_VAR_subnet_id: ${{ secrets.SUBNET_ID }}
                  PKR_VAR_aws_region: ${{ secrets.AWS_REGION }}
                  PKR_VAR_demo_user: ${{ secrets.DEMO_USER }}
                  # PKR_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}
                  # GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}
              run: packer build aws-ubuntu.pkr.hcl

            - name: Retrieve Latest AMI and Save AMI_ID
              id: share_ami
              env:
                  AWS_REGION: ${{ secrets.AWS_REGION }}
              run: |
                  AMI_ID=$(aws ec2 describe-images \
                    --owners self \
                    --filters "Name=name,Values=webapp-ami-*" "Name=state,Values=available" \
                    --query "sort_by(Images, &CreationDate)[-1].ImageId" \
                    --output text --region "${AWS_REGION}")

                  if [[ -n "$AMI_ID" && "$AMI_ID" != "None" ]]; then
                    echo "Found latest AMI: $AMI_ID"
                    echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
                    echo "$AMI_ID" > ami_id.txt
                  else
                    echo "No AMI found, exiting..."
                    exit 1
                  fi

            - name: Upload AWS AMI ID Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ami_id
                  path: ami_id.txt
                  if-no-files-found: error
                  retention-days: 1
                  overwrite: true

            # - name: Save GCP Image ID
            #   env:
            #     GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
            #   run: |
            #     GCP_IMAGE_ID=$(gcloud compute images list \
            #       --project="${GCP_PROJECT_ID}" \
            #       --filter="name~'webapp-image-*'" \
            #       --sort-by="~creationTimestamp" \
            #       --limit=1 \
            #       --format="value(NAME)")
            #     if [[ -n "$GCP_IMAGE_ID" ]]; then
            #       echo "gcp_image_id=$GCP_IMAGE_ID" >> $GITHUB_OUTPUT
            #       echo "$GCP_IMAGE_ID" > gcp_image_id.txt
            #     else
            #       echo "No GCP image found"
            #       exit 1
            #     fi

            # - name: Upload GCP AMI ID Artifact
            #   uses: actions/upload-artifact@v4
            #   with:
            #     name: gcp_image_id
            #     path: gcp_image_id.txt

            - name: Cleanup on Failure
              if: failure()
              run: |
                  echo "Workflow failed! Cleaning up resources..."
                  # Add cleanup steps here
                  # Example: Remove any temporary files or resources created during the workflow
                  rm -f ami_id.txt

            # Share AMI with DEMO account
            - name: Share AMI with DEMO account
              run: |
                  AMI_ID=$(cat ami_id.txt)
                  echo "AMI_ID=$AMI_ID" >> $GITHUB_ENV

                  aws ec2 modify-image-attribute \
                    --image-id $AMI_ID \
                    --launch-permission "Add=[{UserId=${{ secrets.DEMO_AWS_ACCOUNT_ID }}}]"
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_REGION: ${{ secrets.AWS_REGION }}

            # Reconfigure AWS CLI for DEMO account
            - name: Configure AWS CLI for DEMO account
              run: |
                  aws configure set aws_access_key_id ${{ secrets.DEMO_AWS_ACCESS_KEY_ID }}
                  aws configure set aws_secret_access_key ${{ secrets.DEMO_AWS_SECRET_ACCESS_KEY }}
                  aws configure set region ${{ secrets.AWS_REGION }}

            # Create new Launch Template version
            - name: Create new Launch Template version
              run: |
                  # First, list all launch templates to verify what we're working with
                  echo "Available Launch Templates:"
                  aws ec2 describe-launch-templates --query 'LaunchTemplates[*].[LaunchTemplateId,LaunchTemplateName]' --output table

                  # Get the Launch Template ID using exact name pattern
                  echo "Attempting to find Launch Template..."
                  LAUNCH_TEMPLATE_ID=$(aws ec2 describe-launch-templates \
                    --query 'LaunchTemplates[?starts_with(LaunchTemplateName, `Main-launch-template-`)].LaunchTemplateId' \
                    --output text)

                  echo "Found Launch Template ID: '$LAUNCH_TEMPLATE_ID'"

                  # Validate the Launch Template ID
                  if [ "$LAUNCH_TEMPLATE_ID" == "None" ] || [ -z "$LAUNCH_TEMPLATE_ID" ]; then
                    echo "Error: No Launch Template found!"
                    exit 1
                  fi

                  # Verify the Launch Template exists
                  echo "Verifying Launch Template..."
                  aws ec2 describe-launch-templates \
                    --launch-template-ids "$LAUNCH_TEMPLATE_ID" || {
                      echo "Error: Invalid Launch Template ID"
                      exit 1
                    }

                  # Get latest version
                  echo "Getting latest version..."
                  LATEST_VERSION=$(aws ec2 describe-launch-template-versions \
                    --launch-template-id "$LAUNCH_TEMPLATE_ID" \
                    --query "LaunchTemplateVersions[0].VersionNumber" \
                    --output text)

                  echo "Latest version: $LATEST_VERSION"

                  # Create new version
                  AMI_ID=$(cat ami_id.txt)
                  echo "Creating new version with AMI ID: $AMI_ID"
                  aws ec2 create-launch-template-version \
                    --launch-template-id "$LAUNCH_TEMPLATE_ID" \
                    --version-description "Auto-updated by GitHub Actions" \
                    --source-version "$LATEST_VERSION" \
                    --launch-template-data "{\"ImageId\":\"$AMI_ID\"}"

                  echo "Successfully created new Launch Template version for template $LAUNCH_TEMPLATE_ID"

            # Start instance refresh
            - name: Start instance refresh
              id: start_refresh
              run: |
                  # Get ASG Name
                  ASG_NAME=$(aws autoscaling describe-auto-scaling-groups \
                    --query "AutoScalingGroups[?AutoScalingGroupName=='Main-asg'].AutoScalingGroupName" \
                    --output text)

                  if [ -z "$ASG_NAME" ]; then
                    echo "Error: Could not find Auto Scaling Group"
                    echo "Available ASGs:"
                    aws autoscaling describe-auto-scaling-groups --query 'AutoScalingGroups[].AutoScalingGroupName' --output table
                    exit 1
                  fi

                  echo "Found ASG: $ASG_NAME"

                  # Start the refresh
                  REFRESH_ID=$(aws autoscaling start-instance-refresh \
                    --auto-scaling-group-name "$ASG_NAME" \
                    --preferences '{"MinHealthyPercentage": 90, "InstanceWarmup": 300}' \
                    --query "InstanceRefreshId" --output text)

                  echo "Started instance refresh with ID: $REFRESH_ID for ASG: $ASG_NAME"
                  echo "REFRESH_ID=$REFRESH_ID" >> $GITHUB_ENV
                  echo "ASG_NAME=$ASG_NAME" >> $GITHUB_ENV

            # Wait for instance refresh to complete
            - name: Wait for instance refresh to complete
              run: |
                  echo "Waiting for instance refresh to complete (estimated time: 15-30 minutes)..."
                  start_time=$(date +%s)

                  while true; do
                    STATUS=$(aws autoscaling describe-instance-refreshes \
                      --auto-scaling-group-name "${{ env.ASG_NAME }}" \
                      --instance-refresh-ids "${{ env.REFRESH_ID }}" \
                      --query "InstanceRefreshes[0].[Status,StatusReason]" \
                      --output text)
                    
                    status_type=$(echo "$STATUS" | cut -f1)
                    status_reason=$(echo "$STATUS" | cut -f2)
                    current_time=$(date +%s)
                    elapsed_time=$((current_time - start_time))
                    elapsed_minutes=$((elapsed_time / 60))
                    
                    echo "Current status: $status_type (Running for ${elapsed_minutes} minutes)"
                    if [ ! -z "$status_reason" ]; then
                      echo "Status reason: $status_reason"
                    fi
                    
                    if [ "$status_type" == "Successful" ]; then
                      echo "Instance refresh completed successfully after ${elapsed_minutes} minutes!"
                      exit 0
                    elif [ "$status_type" == "Failed" ] || [ "$status_type" == "Cancelled" ]; then
                      echo "Instance refresh failed or was cancelled after ${elapsed_minutes} minutes."
                      exit 1
                    fi
                    
                    echo "Still in progress. Waiting 30 seconds before checking again..."
                    sleep 30
                  done
